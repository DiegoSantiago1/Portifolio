<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prévia para redes sociais</title>
<!-- Fonte da imagem de compartilhamento (og-image.png, 1200×630). Para refazer:
     python assets/og/gerar_og.py  (Playwright). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0f0f10; color: #f5f5f4;
         font-family: "IBM Plex Sans", system-ui, sans-serif; position: relative; }
  .faixa { position: absolute; inset: 0 0 auto 0; height: 8px; background: linear-gradient(90deg, #ea580c, #f97316); }
  .texto { position: absolute; left: 64px; top: 84px; width: 560px; }
  h1 { font-size: 64px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.05; }
  .cargo { font-size: 32px; font-weight: 700; color: #f97316; margin-top: 14px; }
  .rumo { font-size: 30px; font-weight: 600; color: #a8a29e; margin-top: 6px; }
  .stack { margin-top: 34px; font-size: 25px; line-height: 1.6; color: #e7e5e4; }
  .url { position: absolute; left: 64px; bottom: 52px; font-size: 24px; color: #a8a29e; }
  .tela { position: absolute; border-radius: 12px; overflow: hidden; border: 2px solid #3f3f46;
          box-shadow: 0 24px 60px rgba(0,0,0,.55); background: #18181b; }
  .tela img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .t1 { left: 640px; top: 96px; width: 500px; height: 300px; }
  .t2 { left: 720px; top: 300px; width: 440px; height: 290px; }
  .t1 .rotulo { top: 10px; bottom: auto; }
  .rotulo { position: absolute; left: 10px; bottom: 10px; background: rgba(15,15,16,.85); color: #f5f5f4;
            font-size: 15px; font-weight: 600; padding: 5px 10px; border-radius: 6px; }
</style>
</head>
<body>
  <div class="faixa"></div>
  <div class="texto">
    <h1>Diego Santiago</h1>
    <div class="cargo">Analista de Dados</div>
    <div class="rumo">rumo à Engenharia de Dados</div>
    <div class="stack">
      SQL · Python · PySpark · dbt · Power BI<br>
      AWS · Terraform · Databricks · IA (LLM)
    </div>
  </div>
  <div class="tela t1"><img src="../images/us-mortgage-lakehouse.png" alt=""><span class="rotulo">Lakehouse do Financiamento · EUA</span></div>
  <div class="tela t2"><img src="../images/london-cycle-hire-pipeline.jpg" alt=""><span class="rotulo">Pipeline das Bicicletas · Londres</span></div>
  <div class="url">diegosantiago1.github.io/Portifolio</div>
</body>
</html>
